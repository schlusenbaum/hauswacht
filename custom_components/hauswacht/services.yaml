arm:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    profile:
      required: true
      selector:
        text:
    confirm:
      default: false
      selector:
        boolean:
    code:
      selector:
        text:
          type: password

simulate_trigger:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    sensor:
      required: true
      selector:
        entity:
          domain:
            - binary_sensor
            - lock
            - cover

simulate_state:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    sensor:
      required: true
      selector:
        entity:
          domain:
            - binary_sensor
            - lock
            - cover
    state:
      required: true
      selector:
        select:
          translation_key: simulate_state
          options:
            - "on"
            - "off"
            - "unavailable"
            - "real"

simulate_reset:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel

siren_test:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    siren:
      required: true
      selector:
        entity:
          domain: siren
    duration:
      default: 3
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: s
    volume:
      default: low
      selector:
        select:
          translation_key: siren_volume
          options:
            - low
            - medium
            - high
            - very_high
    tone:
      default: burglar
      selector:
        select:
          translation_key: siren_tone
          options:
            - burglar
            - emergency
            - police_panic
            - emergency_panic

siren_test_result:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    siren:
      required: true
      selector:
        entity:
          domain: siren
    heard:
      required: true
      selector:
        boolean:

siren_test_stop:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel

reset_code_lock:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
