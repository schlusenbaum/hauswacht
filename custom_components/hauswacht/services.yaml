arm:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    profile:
      required: true
      selector:
        text:
    confirm:
      default: false
      selector:
        boolean:
    code:
      selector:
        text:
          type: password

simulate_trigger:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    sensor:
      required: true
      selector:
        entity:
          domain: binary_sensor

simulate_state:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
  fields:
    sensor:
      required: true
      selector:
        entity:
          domain: binary_sensor
    state:
      required: true
      selector:
        select:
          translation_key: simulate_state
          options:
            - "on"
            - "off"
            - "unavailable"
            - "real"

simulate_reset:
  target:
    entity:
      integration: hauswacht
      domain: alarm_control_panel
