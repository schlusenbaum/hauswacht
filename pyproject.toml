[project]
name = "hauswacht"
version = "0.1.0"
description = "Profilbasierte Einbruchmeldeanlage für Home Assistant"
license = "MIT"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
# RUF001-003: deutsche Texte nutzen bewusst Gedankenstriche
ignore = ["PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests prüfen Zustände nacheinander; mypy würde die Einengung fälschlich anmahnen
disable_error_code = ["comparison-overlap"]
