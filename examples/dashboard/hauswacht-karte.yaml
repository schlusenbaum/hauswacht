# Hauswacht – Beispielkarte
#
# Dezente Bedienkarte nur mit Standardkarten von Home Assistant (ab 2026.5).
# Einfügen: Dashboard bearbeiten → Karte hinzufügen → "Manuell" → diesen Text einfügen.
#
# Die Entitäts-IDs gelten für eine deutschsprachige Home-Assistant-Instanz. Auf Englisch:
#   select.hauswacht_profile, button.hauswacht_arm, button.hauswacht_arm_anyway,
#   binary_sensor.hauswacht_open_sensors, sensor.hauswacht_system_status
#
# Inhalt:
#  1. Kachel mit Zustand und den Bedienfeld-Knöpfen (nur Knöpfe, denen ein Profil zugeordnet ist)
#  2. Nur unscharf: Auswahl eines beliebigen Profils und "Scharf schalten"
#  3. Nur unscharf UND Sensoren offen: "Trotzdem scharf schalten" (mit Rückfrage).
#     Offene Sensoren werden dabei überbrückt, also bis zum Unscharfschalten nicht
#     überwacht. Klappt nur, wenn das Profil offene Sensoren nicht grundsätzlich verweigert.
#  4. Nur bei Problemen: Systemstatus

type: vertical-stack
cards:
  - type: tile
    entity: alarm_control_panel.hauswacht
    name: Hauswacht
    icon: mdi:shield-home-outline
    features_position: bottom
    features:
      - type: alarm-modes

  - type: tile
    entity: select.hauswacht_profil
    name: Profil
    features_position: inline
    features:
      - type: select-options
    visibility:
      - condition: state
        entity: alarm_control_panel.hauswacht
        state: disarmed

  - type: grid
    columns: 2
    square: false
    visibility:
      - condition: state
        entity: alarm_control_panel.hauswacht
        state: disarmed
    cards:
      - type: shortcut
        label: Scharf schalten
        icon: mdi:shield-lock-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.hauswacht_scharf_schalten
      - type: shortcut
        label: Trotzdem scharf
        icon: mdi:shield-alert-outline
        visibility:
          - condition: state
            entity: binary_sensor.hauswacht_offene_sensoren
            state: "on"
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.hauswacht_trotzdem_scharf_schalten
          confirmation:
            text: >-
              Trotzdem scharf schalten? Die offenen Sensoren werden bis zum Unscharfschalten
              NICHT überwacht.

  - type: markdown
    text_only: true
    content: >-
      **Offen:** {{ state_attr('binary_sensor.hauswacht_offene_sensoren', 'names')
      | join(', ') }}
    visibility:
      - condition: state
        entity: binary_sensor.hauswacht_offene_sensoren
        state: "on"
      - condition: state
        entity: alarm_control_panel.hauswacht
        state: disarmed

  - type: tile
    entity: sensor.hauswacht_systemstatus
    name: Hauswacht-System
    visibility:
      - condition: state
        entity: sensor.hauswacht_systemstatus
        state_not: ok
