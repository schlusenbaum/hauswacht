# Hauswacht – Beispiel: selbst gebautes Keypad mit ESPHome (allgemeines Keypad, ADR 0012)
#
# UNGETESTET – Nutzung auf eigene Verantwortung. Ein Beispiel zum Anpassen, kein fertiges Gerät.
#
# Was es tut:
# - 4x4-Tastenfeld: PIN tippen, dann A (Abwesend), B (Zuhause), C (Nacht) oder D (Unscharf).
#   Das Gerät ruft dafür direkt die Aktion hauswacht.keypad_input auf – ohne Automation.
# - Zwei LEDs zeigen, was Hauswacht meldet (Anzeige-Entität): grün = unscharf, rot = scharf,
#   rot blinkend = Verzögerung oder Alarm.
#
# Vorher:
# 1. In Hauswacht ein „Keypad (allgemein)“ anlegen, z. B. „Keypad Garage“, mit den Tasten
#    away, home und night. Kennung (z. B. keypad_garage) und Anzeige-Entität notieren.
# 2. In Home Assistant: Einstellungen → Geräte & Dienste → ESPHome → dieses Gerät → Optionen →
#    „Gerät darf Home-Assistant-Aktionen ausführen“ einschalten.
# 3. Pins, Kennung und Entität unten anpassen.

esphome:
  name: keypad-garage

esp32:
  board: esp32dev

api:
logger:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matrix_keypad:
  id: tastenfeld
  rows:
    - pin: GPIO13
    - pin: GPIO12
    - pin: GPIO14
    - pin: GPIO27
  columns:
    - pin: GPIO26
    - pin: GPIO25
    - pin: GPIO33
    - pin: GPIO32
  keys: "123A456B789C*0#D"

key_collector:
  - id: eingabe
    source_id: tastenfeld
    min_length: 0          # 0 = auch ohne PIN (wenn Scharfschalten ohne PIN erlaubt ist)
    max_length: 8
    allowed_keys: "0123456789"
    end_keys: "ABCD"
    end_key_required: true
    back_keys: "*"
    clear_keys: "#"
    timeout: 10s
    on_result:
      - homeassistant.action:
          action: hauswacht.keypad_input
          data:
            keypad: keypad_garage                # Kennung aus Hauswacht
          data_template:
            button: "{{ taste }}"
            code: "{{ pin }}"
          variables:
            taste: |-
              if (end_key == 'A') return std::string("away");
              if (end_key == 'B') return std::string("home");
              if (end_key == 'C') return std::string("night");
              return std::string("disarm");
            pin: |-
              return x;

output:
  - platform: gpio
    id: led_gruen_out
    pin: GPIO4
  - platform: gpio
    id: led_rot_out
    pin: GPIO16

light:
  - platform: binary
    id: led_gruen
    output: led_gruen_out
  - platform: binary
    id: led_rot
    output: led_rot_out
    effects:
      - strobe:

text_sensor:
  - platform: homeassistant
    id: anzeige
    entity_id: sensor.hauswacht_keypad_garage_anzeige   # Anzeige-Entität aus Hauswacht
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "disarmed";'
            then:
              - light.turn_on: led_gruen
              - light.turn_off: led_rot
            else:
              - light.turn_off: led_gruen
              - if:
                  condition:
                    lambda: 'return x.rfind("armed", 0) == 0;'
                  then:
                    - light.turn_on: led_rot
                  else:
                    # Verzögerung, Alarm, Testalarm, Brand: blinken
                    - light.turn_on:
                        id: led_rot
                        effect: strobe
