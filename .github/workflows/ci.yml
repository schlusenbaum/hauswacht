name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Werkzeuge installieren
        run: pip install ruff mypy pytest
      - name: Ruff (Lint)
        run: ruff check .
      - name: Ruff (Format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
